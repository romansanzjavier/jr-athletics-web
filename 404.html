<meta name="theme-color" content="#141416">
<script>
  /* GitHub Pages sirve esta página en cualquier ruta que no exista (también en
     subcarpetas). La etiqueta <base href="/"> de arriba hace que estilos, tipografía
     e imágenes carguen desde la raíz de jrathleticsfit.com. Si la web se ve en
     usuario.github.io/repositorio/, se ajusta aquí a esa carpeta. */
  (function () {
    var parts = location.pathname.split('/');
    if (/\.github\.io$/i.test(location.hostname) && parts.length > 2 && parts[1]) {
      document.querySelector('base').href = '/' + parts[1] + '/';
    }
  })();
</script>
